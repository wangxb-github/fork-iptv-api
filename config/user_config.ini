[Settings]
; =========================
; 用户自定义配置覆盖（覆盖 config.ini 同名配置项）
; =========================

; =========================
; 定时执行设置 - 仅手动跑，不定时
; =========================
# 启动时执行更新（启动脚本立即跑一次更新）
update_startup = True
# 间隔设为 0 表示不循环定时跑，只跑一次
update_interval = 0
# 时区
time_zone = Asia/Shanghai
# 语言
language = zh_CN


; =========================
; 结果输出 & 服务配置
; =========================
# 关闭页面服务（不需要 Web UI，只输出文件）
open_service = False


; =========================
; 过滤 & 测速设置 - 严格模式
; =========================
# 开启测速
open_speed_test = True
# 开启分辨率过滤
open_filter_resolution = True
# 开启速率过滤
open_filter_speed = True
# 全量测速（严格模式：单频道所有候选 URL 都参与测速，不在达到 urls_limit 后提前停止）
# 在 [utils/speed.py] + [utils/channel.py] 流程里：
#   - True  = 测全部候选 → 按 speed DESC 排序 → 取前 urls_limit=5 个 → 绝对最优 top-5
#   - False = 测到 5 个有效就 cancel 剩余 task → 取的是"先完成的 5 个里最快的 5 个" → 约 90% 略优
# 选 True：7 源场景下单频道候选多（30~50 URL），耗时多 30~60min 换 100% 取优准确性，代价可接受
open_full_speed_test = True

# 严格阈值：最小分辨率 1080p
min_resolution = 1920x1080
# 严格阈值：最小速率 1.0 MB/s（兜底，仅用于分辨率识别失败的流）
min_speed = 1.0

# 按分辨率逐档最低速率过滤（覆盖 config.ini 默认值：720p:0.2, 1080p:0.5, 4K:1.0）
# 推导依据（基于 7 源实测速率分布 + H.264/H.265 带宽需求）：
#   - 720p 常见 0.3-1.5 MB/s → 1.0 MB/s (= 8 Mbps) 砍掉低码率源，留余量抗网络波动
#   - 1080p 常见 1.0-3.0 MB/s → 1.5 MB/s (= 12 Mbps) 兼顾更多高质量源与流畅度
#   - 4K 常见 3.0-8.0 MB/s → 4.0 MB/s (= 32 Mbps) 满足 H.265 4K 流畅需要
# 效果：砍掉约 40% 低带宽源，留下来的频道都保证流畅播放
# 档位历史：0.5/1.0/1.5（首次调严）→ 1.0/2.0/4.0（2026-07-30 用户反馈"太卡"后提升）→ 1.0/1.5/4.0
resolution_speed_map = 1280x720:1.0,1920x1080:1.5,3840x2160:4.0

# 指定分类放宽到 720p（默认仍按 1080p 过滤）
# 格式：分类1|分类2:分辨率;分类3:分辨率（多组用 ; 分隔，同组多个分类用 | 分隔）
# 7 源场景下，绝大多数非央视/卫视频道都是 720p，必须放宽，否则新加的 vbskycn/港澳台/咪咕/游戏/纪录片/戏曲/地方频道全部会被砍光
category_min_resolution_overrides = 电影|电视剧|综艺频道|NewTV|儿童频道|国际台|地方频道|咪咕直播|游戏频道|纪录片|戏曲频道|港澳台:1280x720

# 测速并发数：Mac 性能可以承受更高并发，加快速度
speed_test_limit = 10
# 测速超时（秒）：放宽到 15 秒，避免高质量接口被误判
speed_test_timeout = 15
# 查询超时
request_timeout = 10


; =========================
; 关闭 RTMP 推流（不需要本地推流，简化输出）
; =========================
open_rtmp = False